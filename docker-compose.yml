# Add to system crontab for automatic bank sync:
# 0 6,12,18 * * * curl -s -H "Authorization: Bearer YOUR_CRON_SECRET" http://localhost:7331/api/cron/fints-sync
# 0 0 1 1 * curl -s -H "Authorization: Bearer YOUR_CRON_SECRET" http://localhost:7331/api/cron/inflation-check

services:
  app:
    image: ghcr.io/vas3k/taxhacker:latest
    ports:
      - "7331:7331"
    environment:
      - NODE_ENV=production
      - SELF_HOSTED_MODE=true
      - UPLOAD_PATH=/app/data/uploads
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/taxhacker
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL_NAME=qwen2.5vl:7b
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    depends_on:
      - postgres
      - ollama
    logging:
      driver: "local"
      options:
        max-size: "100M"
        max-file: "3"

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ./ollama_data:/root/.ollama
    restart: unless-stopped
    # Uncomment the following lines for GPU support:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    logging:
      driver: "local"
      options:
        max-size: "100M"
        max-file: "3"

  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=taxhacker
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    logging:
      driver: "local"
      options:
        max-size: "100M"
        max-file: "3"
